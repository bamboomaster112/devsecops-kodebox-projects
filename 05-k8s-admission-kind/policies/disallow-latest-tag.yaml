# ":latest" points at different bytes over time, so a rollback or a new node can quietly
# run code nobody reviewed. The second check matters: after the image policy pins a
# digest, "app:latest" becomes "app:latest@sha256:...", which no longer ends in ":latest".
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kbx-apps
  validations:
    - expression: >-
        object.spec.containers.all(c, !c.image.endsWith(':latest') && !c.image.contains(':latest@'))
      message: "use an explicit version tag, not ':latest'"
