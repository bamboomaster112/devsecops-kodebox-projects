# A container without limits can starve its neighbours, which turns one bug or one
# attacker into an outage for everything on the node.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kbx-apps
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: "every container needs resources.limits.cpu and resources.limits.memory"
