# Pods in kbx-apps may only run images from the internal registry, where every image
# has passed the security gate (project 04) and been signed (project 03).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kbx-apps
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.startsWith('kbx-registry:5000/')) &&
        (!has(object.spec.initContainers) ||
         object.spec.initContainers.all(c, c.image.startsWith('kbx-registry:5000/')))
      messageExpression: >-
        'images must come from kbx-registry:5000, found: ' +
        object.spec.containers.map(c, c.image).join(', ')
