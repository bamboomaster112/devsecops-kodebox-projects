# Pushed to the approved registry but never signed.
# expect-denied-by: Kyverno verify-image-signature
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-image
  namespace: kbx-apps
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: kbx-registry:5000/kbx/unsigned-app:1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
